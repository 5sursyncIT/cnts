services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cnts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cnts}
      POSTGRES_DB: ${POSTGRES_DB:-cnts}
    ports:
      - "127.0.0.1:5432:5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  portal:
    build:
      context: .
      dockerfile: ./portal/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://cnts.gouv.sn}
      BACKEND_URL: http://api:8000
      # CMS Strapi : appels serveur via le réseau docker, médias via l'URL publique.
      CMS_INTERNAL_URL: http://cms:1337
      CMS_PUBLIC_URL: ${CMS_PUBLIC_URL:-https://cnts.gouv.sn/cms}
    ports:
      - "127.0.0.1:3000:3000"
    restart: always

  web:
    build:
      context: .
      dockerfile: ./web/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://cnts.gouv.sn}
      BACKEND_API_URL: http://api:8000
      BACKOFFICE_API_BASE_URL: http://api:8000/api
      BACKOFFICE_SESSION_SECRET: ${BACKOFFICE_SESSION_SECRET:?BACKOFFICE_SESSION_SECRET requis (voir .env)}
      BACKOFFICE_PREAUTH_SECRET: ${BACKOFFICE_PREAUTH_SECRET:?BACKOFFICE_PREAUTH_SECRET requis (voir .env)}
    ports:
      - "127.0.0.1:3001:3000"
    restart: always

  api:
    build:

      context: ./backend
    environment:
      CNTS_ENV: ${CNTS_ENV:-dev}
      CNTS_LOG_LEVEL: ${CNTS_LOG_LEVEL:-INFO}
      CNTS_DATABASE_URL: ${CNTS_DATABASE_URL:-postgresql+psycopg://cnts:cnts@db:5432/cnts}
      CNTS_CNI_HASH_KEY: ${CNTS_CNI_HASH_KEY:?CNTS_CNI_HASH_KEY requis (voir .env)}
      CNTS_AUTH_TOKEN_SECRET: ${CNTS_AUTH_TOKEN_SECRET:?CNTS_AUTH_TOKEN_SECRET requis (voir .env)}
      CNTS_RECOVERY_CODES_SECRET: ${CNTS_RECOVERY_CODES_SECRET:?CNTS_RECOVERY_CODES_SECRET requis (voir .env)}
      CNTS_ADMIN_TOKEN: ${CNTS_ADMIN_TOKEN:?CNTS_ADMIN_TOKEN requis (voir .env)}
      CNTS_DIN_SITE_CODE: ${CNTS_DIN_SITE_CODE:-CNTS0}
      CNTS_FRACTIONNEMENT_MAX_OVERAGE_ML: ${CNTS_FRACTIONNEMENT_MAX_OVERAGE_ML:-250}
      CNTS_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/tests:/app/tests
      - ./backend/static:/app/static
    depends_on:
      - db
    restart: always

  # CMS Strapi (contenu éditorial du portail) — https://cnts.gouv.sn/cms/admin
  # Base `strapi` dédiée dans le même serveur Postgres (voir cms/README.md).
  cms:
    build:
      context: ./cms
      args:
        PUBLIC_URL: ${CMS_PUBLIC_URL:-https://cnts.gouv.sn/cms}
    environment:
      NODE_ENV: production
      PUBLIC_URL: ${CMS_PUBLIC_URL:-https://cnts.gouv.sn/cms}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${CMS_DB_NAME:-strapi}
      DATABASE_USERNAME: ${CMS_DB_USER:-strapi}
      DATABASE_PASSWORD: ${CMS_DB_PASSWORD:?CMS_DB_PASSWORD requis (voir .env)}
      APP_KEYS: ${CMS_APP_KEYS:?CMS_APP_KEYS requis (voir .env)}
      API_TOKEN_SALT: ${CMS_API_TOKEN_SALT:?CMS_API_TOKEN_SALT requis (voir .env)}
      ADMIN_JWT_SECRET: ${CMS_ADMIN_JWT_SECRET:?CMS_ADMIN_JWT_SECRET requis (voir .env)}
      JWT_SECRET: ${CMS_JWT_SECRET:?CMS_JWT_SECRET requis (voir .env)}
      TRANSFER_TOKEN_SALT: ${CMS_TRANSFER_TOKEN_SALT:?CMS_TRANSFER_TOKEN_SALT requis (voir .env)}
      ENCRYPTION_KEY: ${CMS_ENCRYPTION_KEY:?CMS_ENCRYPTION_KEY requis (voir .env)}
    ports:
      - "127.0.0.1:1337:1337"
    volumes:
      - cms_uploads:/opt/app/public/uploads
    depends_on:
      - db
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: always

  celery-worker:
    build:
      context: ./backend
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      CNTS_ENV: ${CNTS_ENV:-dev}
      CNTS_LOG_LEVEL: ${CNTS_LOG_LEVEL:-INFO}
      CNTS_DATABASE_URL: ${CNTS_DATABASE_URL:-postgresql+psycopg://cnts:cnts@db:5432/cnts}
      CNTS_CNI_HASH_KEY: ${CNTS_CNI_HASH_KEY:?CNTS_CNI_HASH_KEY requis (voir .env)}
      CNTS_AUTH_TOKEN_SECRET: ${CNTS_AUTH_TOKEN_SECRET:?CNTS_AUTH_TOKEN_SECRET requis (voir .env)}
      CNTS_RECOVERY_CODES_SECRET: ${CNTS_RECOVERY_CODES_SECRET:?CNTS_RECOVERY_CODES_SECRET requis (voir .env)}
      CNTS_ADMIN_TOKEN: ${CNTS_ADMIN_TOKEN:?CNTS_ADMIN_TOKEN requis (voir .env)}
      CNTS_REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: always

  celery-beat:
    build:
      context: ./backend
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      CNTS_REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: always

volumes:
  postgres_data:
  cms_uploads:
