<html lang="fr" data-theme="solaire">
<head>

<title>CNTS Sénégal — Plateforme du don de sang (v2)</title>
<link rel="icon" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Newsreader:ital,opsz,wght@0,16..72,400;0,16..72,500;0,16..72,600;1,16..72,500&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/theme-v2.css" />
<style>
#root{min-height:100vh}
@media (max-width:1100px){.desktop-nav{display:none!important}.mobile-only{display:flex!important}.util-addr{display:none!important}}
@media (max-width:1000px){.two-col,.donor-grid,.hero-grid{grid-template-columns:1fr!important}.grid-4,.bento{grid-template-columns:repeat(2,minmax(0,1fr))!important}.hero-photo{display:none!important}.pro-aside{display:none!important}}
@media (max-width:760px){.grid-3,.footer-grid{grid-template-columns:1fr 1fr!important}.step-label{display:none!important}.util-left span:nth-child(2){display:none!important}}
@media (max-width:640px){.grid-3{grid-template-columns:1fr!important}}
@media (max-width:560px){.baro-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;row-gap:18px!important}.grid-3,.grid-4,.footer-grid,.bento{grid-template-columns:1fr!important}.bento-big{grid-column:auto!important;min-height:260px!important}.day-grid{grid-template-columns:repeat(3,1fr)!important}}
</style>
</head>

<div id="root"></div>
