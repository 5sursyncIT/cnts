<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CNTS Sénégal — Plateforme du don de sang</title>
<link rel="icon" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Newsreader:ital,opsz,wght@0,16..72,400;0,16..72,500;0,16..72,600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/tokens.css" />
<style>
  #root { min-height: 100vh; }
  @keyframes cntsPulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,255,255,.55); }
    70%  { box-shadow: 0 0 0 7px rgba(255,255,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
  }
  /* ---- Responsive ---- */
  @media (max-width: 1040px) {
    .desktop-nav { display: none !important; }
    .mobile-only { display: flex !important; }
    .util-addr { display: none !important; }
  }
  @media (max-width: 1000px) {
    .two-col, .donor-grid, .hero-grid { grid-template-columns: 1fr !important; }
    .grid-4 { grid-template-columns: repeat(2, 1fr) !important; }
    .hero-photo { display: none !important; }
    .pro-aside { display: none !important; }
  }
  @media (max-width: 760px) {
    .grid-3, .footer-grid { grid-template-columns: 1fr 1fr !important; }
    .step-label { display: none !important; }
    .util-left span:nth-child(2) { display: none !important; }
  }
  @media (max-width: 560px) {
    .grid-3, .grid-4, .footer-grid { grid-template-columns: 1fr !important; }
    .day-grid { grid-template-columns: repeat(3, 1fr) !important; }
  }
  /* Barometer: keep 8 bags scrollable on narrow screens */
  @media (max-width: 640px) {
    .grid-3 { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="app/data.js"></script>
<script type="text/babel" src="app/components.jsx"></script>
<script type="text/babel" src="app/screens-public-a.jsx"></script>
<script type="text/babel" src="app/screens-public-b.jsx"></script>
<script type="text/babel" src="app/screens-public-c.jsx"></script>
<script type="text/babel" src="app/screens-institutional.jsx"></script>
<script type="text/babel" src="app/screens-content.jsx"></script>
<script type="text/babel" src="app/screens-admin.jsx"></script>
<script type="text/babel" src="app/main.jsx"></script>
</body>
</html>
